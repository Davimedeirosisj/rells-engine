<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RELLS ENGINE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M12 10l10 6-10 6z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>RELLS ENGINE</h1>
      </div>
      <nav>
        <button id="nav-import" class="link-btn" type="button">Importar</button>
        <button id="nav-projects" class="link-btn active" type="button">Projetos</button>
      </nav>
    </header>

    <section id="view-import" class="view" hidden>
      <p class="subtitle">Importar projeto</p>

      <div class="import-form">
        <label class="field">
          <span class="field-label">VÍDEO ORIGINAL</span>
          <input type="file" id="video" accept=".mp4,.mov,.mkv,.avi,.webm,.m4v" />
          <span class="field-hint" id="video-name">Nenhum arquivo selecionado</span>
        </label>

        <label class="field">
          <span class="field-label">SRT</span>
          <input type="file" id="srt" accept=".srt" />
          <span class="field-hint" id="srt-name">Nenhum arquivo selecionado</span>
        </label>

        <label class="field">
          <span class="field-label">CORTES.JSON</span>
          <input type="file" id="cortes" accept=".json" />
          <span class="field-hint" id="cortes-name">Nenhum arquivo selecionado</span>
        </label>

        <button id="import-btn" class="primary" type="button">IMPORTAR PROJETO</button>
        <div id="message" class="message" hidden></div>
      </div>
    </section>

    <section id="view-dashboard" class="view">
      <div id="dashboard-summary"></div>
      <div id="cut-table-wrap" class="cut-table-wrap" hidden>
        <table class="cut-table">
          <thead>
            <tr>
              <th>#</th>
              <th>TEMA</th>
              <th>TÍTULO</th>
              <th>TEMPO</th>
              <th>STATUS</th>
              <th>AÇÃO</th>
            </tr>
          </thead>
          <tbody id="cut-tbody"></tbody>
        </table>
      </div>
      <div id="error-list" class="error-list"></div>
      <div class="project-actions">
        <button id="generate-all-btn" class="primary" type="button" hidden>GERAR TODOS OS CORTES</button>
        <button id="export-btn" class="primary" type="button" hidden>EXPORTAR ZIP</button>
      </div>
    </section>

    <div id="preview-modal" class="modal" hidden>
      <div class="modal-content">
        <button id="preview-close" class="modal-close" type="button" aria-label="Fechar">×</button>
        <video id="preview-video" controls playsinline autoplay muted></video>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
